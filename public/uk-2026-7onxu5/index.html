<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f3d6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영국 연수">
<title>영국 연수 길잡이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<style>
/* Layout: phone-first single column; live "now" panel, tabbed sections, fixed tab bar; detail and editor sheets slide over the page. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --fg:#172033; --muted:#5b6578; --line:#d9dee7;
  --ink:#1f3d6b; --accent:#c27a1a; --chip:#e4eaf3; --live:#1d7a4f; --livebg:#e3f3ea;
  --warn:#a3392a; --warnbg:#fbece8; --past:#97a0b0;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10141b; --surface:#1a202b; --fg:#e7ebf1; --muted:#9aa3b3; --line:#2b3341;
  --ink:#a4c0ea; --accent:#e5a24f; --chip:#232d3d; --live:#5fd09a; --livebg:#16301f;
  --warn:#f08b78; --warnbg:#3a201c; --past:#5f6878; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) 104px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
a{color:var(--ink)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.clock{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.clockrow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lt{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1}
.lab{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.kst{font-family:var(--mono);font-size:15px;color:var(--muted)}
.dayline{font-size:14px}
.dayline b{color:var(--accent);font-weight:600}

.now,.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.now{padding:16px;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--livebg);color:var(--live);align-self:flex-start}
.pill.next{background:var(--chip);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion:no-preference){.pill.live .dot{animation:pulse 1.6s infinite}}
@keyframes pulse{50%{opacity:.25}}
.nowtitle{font-size:19px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.divider{height:1px;background:var(--line)}

.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:52px 14px 1fr;gap:0 10px;align-items:start;padding-block:8px}
.ev .t{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px;text-align:right}
.ev .rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.ev .rail::before{content:"";position:absolute;top:0;bottom:-8px;width:2px;background:var(--line)}
.ev:last-child .rail::before{bottom:auto;height:12px}
.ev .node{position:relative;margin-top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.ev .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.ev .where{font-size:12.5px;color:var(--muted)}
.ev.inst .what{font-weight:600;color:var(--ink)}
.ev.inst .node{border-color:var(--accent);background:var(--accent)}
.ev.past .what,.ev.past .t{color:var(--past)}
.ev.past .node{border-color:var(--past);background:var(--past)}
.ev.cur .node{border-color:var(--live);background:var(--live);box-shadow:0 0 0 4px var(--livebg)}
.ev.cur .what{color:var(--live);font-weight:700}
.ev button.open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:4px;background:var(--chip);color:var(--ink);margin-right:4px}
.tag.warn{background:var(--warnbg);color:var(--warn)}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:58px}
.days button .d{font-family:var(--mono);font-size:14px;font-weight:600}
.days button .w{font-size:11px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.days button[aria-pressed="true"] .w{color:var(--surface);opacity:.8}
.days button.today{border-color:var(--accent)}

.instlist{display:flex;flex-direction:column;gap:10px}
.instbtn{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.instbtn .when{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.instbtn .nm{font-weight:700;font-size:16px}
.instbtn .ko{font-size:13px;color:var(--muted)}
.note{font-size:13px;background:var(--warnbg);color:var(--warn);padding:8px 10px;border-radius:8px}
.info{font-size:13px;background:var(--chip);color:var(--ink);padding:8px 10px;border-radius:8px}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.mini td:first-child{color:var(--muted);width:38%;padding-right:10px}

/* memos */
#map{height:300px;border-radius:12px;border:1px solid var(--line);overflow:hidden;z-index:0}
.mlist{display:flex;flex-direction:column;gap:10px}
.mday{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:4px}
.mitem{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.mitem:focus-visible{outline:2px solid var(--accent)}
.mhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.mhead .mono{color:var(--fg);font-weight:600}
.mtext{font-size:14.5px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:flex;gap:6px;overflow-x:auto}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:none;background:var(--chip)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:20px 8px;border:1px dashed var(--line);border-radius:12px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcell{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--chip);max-width:100%}
.pcell img{width:100%;height:100%;object-fit:cover;display:block}
.pcell .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:26px;cursor:pointer;padding:0}
.pcell .pt{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:10px 5px 3px;font-family:var(--mono)}
.addphoto{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;color:var(--ink);font-size:13px;cursor:pointer;text-align:center;padding:6px}
textarea,select,input[type=text]{width:100%;font-size:15px;line-height:1.5;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:150px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.savestate{font-size:12.5px;color:var(--muted)}
.mpin{width:30px;height:30px;border-radius:7px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);background:#c27a1a center/cover no-repeat;color:#fff;font:700 12px/26px var(--sans);text-align:center}
.vpin{width:14px;height:14px;border-radius:3px;transform:rotate(45deg);background:#1f3d6b;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.leaflet-popup-content{font-family:var(--sans);font-size:13px;margin:10px 12px}
.leaflet-popup-content img{width:150px;height:110px;object-fit:cover;border-radius:6px;display:block;margin-bottom:6px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:transparent;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink);font-weight:600}

.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheethead{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheethead .in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:0;background:transparent;color:var(--ink);font-size:15px;font-weight:500;cursor:pointer;padding:4px 0}
.sheet .wrap{padding-top:16px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.big{font-size:22px;font-weight:700}
ul.dots{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.q{display:flex;flex-direction:column;gap:3px;padding-top:10px;border-top:1px solid var(--line)}
.q .en{font-size:16px;font-weight:500;line-height:1.5}
.q .ko{font-size:13px;color:var(--muted)}
.qhead{display:flex;justify-content:space-between;align-items:center}
.qn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13.5px;max-width:90vw}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div id="view-now" role="tabpanel">
    <div class="sec">
      <div class="clock">
        <span class="lab">현지 시각 · 영국 (BST)</span>
        <div class="clockrow"><span class="lt" id="lt">--:--</span><span class="kst" id="kst">한국 --:--</span></div>
        <p class="dayline" id="dayline"></p>
      </div>
      <div class="now" id="nowcard"></div>
      <div class="card" id="loccard"></div>
      <div class="sec">
        <div class="sechead"><h2 id="todayhead">오늘 일정</h2><button class="btn" type="button" id="gotoall">전체 일정</button></div>
        <ol class="tl" id="todaytl"></ol>
      </div>
    </div>
  </div>

  <div id="view-plan" role="tabpanel" hidden>
    <div class="sec">
      <h2>전체 일정 · 6박 8일</h2>
      <div class="days" id="days"></div>
      <div class="card" id="dayhotel"></div>
      <ol class="tl" id="daytl"></ol>
      <p class="small muted">일정은 현지 사정에 따라 바뀔 수 있어요.</p>
    </div>
  </div>

  <div id="view-inst" role="tabpanel" hidden>
    <div class="sec">
      <h2>방문 기관</h2>
      <p class="small muted">누르면 기관 소개, 세션 내용, 1조 질문, 그 기관 메모를 볼 수 있어요.</p>
      <div class="instlist" id="instlist"></div>
    </div>
  </div>

  <div id="view-memo" role="tabpanel" hidden>
    <div class="sec">
      <div class="sechead"><h2>현장 메모</h2><span class="small muted" id="memocount"></span></div>
      <div id="map" role="img" aria-label="메모와 연수 장소 지도"></div>
      <p class="small muted">주황 사각형은 메모, 남색 마름모는 연수 장소, 파란 점은 내 위치예요.</p>
      <div class="btnrow">
        <button class="btn" type="button" id="btn-report">보고서용 정리</button>
        <button class="btn" type="button" id="btn-backup">백업 내보내기</button>
        <label class="btn" for="importfile">백업 불러오기</label>
        <input type="file" id="importfile" accept="application/json,.json" hidden>
      </div>
      <div class="mlist" id="mlist"></div>
    </div>
  </div>

  <div id="view-info" role="tabpanel" hidden>
    <div class="sec" id="infobody"></div>
  </div>
</div>

<button class="fab" type="button" id="fab" hidden>+ 메모</button>

<nav class="tabbar" role="tablist" aria-label="화면 전환"><div class="in">
  <button type="button" role="tab" data-tab="now" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>지금</button>
  <button type="button" role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>일정</button>
  <button type="button" role="tab" data-tab="inst" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20h18M5 20V10l7-5 7 5v10M9 20v-6h6v6"/></svg>기관</button>
  <button type="button" role="tab" data-tab="memo" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>메모</button>
  <button type="button" role="tab" data-tab="info" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>정보</button>
</div></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheethead"><div class="in"><button class="back" type="button" id="sheetback">← 돌아가기</button><span id="sheetaction"></span></div></div>
  <div class="wrap" id="sheetbody"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= data ================= */
var PLACES={
  icn:{name:"인천국제공항 제2여객터미널",addr:"Incheon International Airport Terminal 2",lat:37.4692,lng:126.4505},

  tmc:{name:"The Manchester College",addr:"The Manchester College, Manchester",lat:53.4853,lng:-2.2262},
  tameside:{name:"Tameside College",addr:"Beaufort Road, Ashton-under-Lyne OL6 6NX",lat:53.4893,lng:-2.0999},

};
var MAP_PLACES=["voco","himan","novo","tmc","tameside","ofsted","wfc","lhr"];
var HOSP={
  "레스터":{name:"Leicester Royal Infirmary",addr:"Infirmary Square, Leicester LE1 5WW",phone:"+44 300 303 1573",note:"호텔에서 차로 약 5분"},
  "맨체스터":{name:"Manchester Royal Infirmary",addr:"Oxford Road, Manchester M13 9WL",phone:"+44 161 276 1234 (응급 +44 161 276 4147)",note:"호텔에서 차로 약 10분"},
  "런던":{name:"Charing Cross Hospital",addr:"Fulham Palace Road, London W6 8RF",phone:"+44 20 3311 1005",note:"호텔에서 차로 약 5분"}
};
/* tz: "L" = 영국(BST, UTC+1), "K" = 한국(UTC+9) */
var DAYS=[
 {date:"2026-10-14",w:"수",n:1,city:"인천 → 레스터",hotel:"voco",ev:[
  {t:"08:00",tz:"K",what:"인천공항 T2 3층 A, 대한항공 카운터 앞 집결",place:"icn"},
  {t:"10:55",tz:"K",what:"인천 출발 (KE907), 기내식",place:"icn"},
  {t:"17:20",tz:"L",what:"히드로 도착, 입국 심사",place:"lhr",tip:"한국 여권은 자동출입국심사대(ePassport gates)를 쓸 수 있어요."},
  {t:"18:20",tz:"L",what:"레스터로 버스 이동 (약 3시간), 휴게소 석식",place:"lhr"},
  {t:"22:00",tz:"L",what:"voco Leicester 체크인",place:"voco"}]},
 {date:"2026-10-15",w:"목",n:2,city:"레스터 → 맨체스터",hotel:"himan",ev:[
  {t:"08:30",tz:"L",what:"조식, 짐 정리, 체크아웃",place:"voco"},
  {t:"09:00",tz:"L",what:"맨체스터로 이동",place:"voco"},
  {t:"12:00",tz:"L",what:"중식 (현지식)",place:"tmc"},

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function evEpoch(date,t,tz){var p=date.split("-"),h=t.split(":");var off=tz==="K"?9:1;return Date.UTC(+p[0],+p[1]-1,+p[2],+h[0]-off,+h[1]);}
var ALL=[];DAYS.forEach(function(d,di){d.ev.forEach(function(e){e.day=di;e.at=evEpoch(d.date,e.t,e.tz);ALL.push(e);});});
var TRIP_END=evEpoch("2026-10-21","16:15","K");
var fmtCache={};
function fmtr(tz,opts){var k=tz+JSON.stringify(opts);return fmtCache[k]||(fmtCache[k]=new Intl.DateTimeFormat(opts.loc||"ko-KR",Object.assign({timeZone:tz},opts.o)));}
function fmt(ms,tz){return fmtr(tz,{o:{hour:"2-digit",minute:"2-digit",hour12:false}}).format(new Date(ms));}
function ymdIn(ms,tz){return fmtr(tz,{loc:"en-CA",o:{year:"numeric",month:"2-digit",day:"2-digit"}}).format(new Date(ms));}
function fmtDT(ms){var y=ymdIn(ms,"Europe/London");return y.slice(5).replace("-","/")+" "+fmt(ms,"Europe/London");}
function mapUrlAddr(a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a);}
function mapUrl(k){return mapUrlAddr(PLACES[k].addr);}
function dirUrl(k){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(PLACES[k].addr);}
function dur(ms){var m=Math.max(0,Math.round(ms/60000));var h=Math.floor(m/60),mm=m%60;if(h>=24){return Math.floor(h/24)+"일 "+(h%24)+"시간";}return (h?h+"시간 ":"")+mm+"분";}
function currentIdx(now){var c=-1;for(var i=0;i<ALL.length;i++){if(ALL[i].at<=now)c=i;}return c;}
function dayIndexFor(now){var ymd=ymdIn(now,"Europe/London");for(var i=0;i<DAYS.length;i++)if(DAYS[i].date===ymd)return i;return now<ALL[0].at?0:DAYS.length-1;}
function tagHtml(t){return '<span class="tag'+(/제한|동시/.test(t)?' warn':'')+'">'+esc(t)+'</span>';}
function toast(msg){var t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2400);}
function hav(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,s=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(s));}

/* ================= now view ================= */
function renderClock(){var n=Date.now();$("lt").textContent=fmt(n,"Europe/London");$("kst").textContent="한국 "+fmt(n,"Asia/Seoul");}
function evLine(e){var d=DAYS[e.day];return d.date.slice(5).replace("-","/")+" ("+d.w+") "+e.t+(e.tz==="K"?" 한국시각":"");}
function renderNow(){
  var n=Date.now(),ci=currentIdx(n),di=dayIndexFor(n),d=DAYS[di];
  if(n<ALL[0].at)$("dayline").innerHTML="출발까지 <b>"+esc(dur(ALL[0].at-n))+"</b> 남았어요";
  else if(n>TRIP_END)$("dayline").textContent="연수가 끝났어요. 결과보고서 제출을 챙겨주세요";
  else $("dayline").innerHTML="<b>"+d.n+"일차</b> · "+esc(d.city);
  var cur=ci>=0?ALL[ci]:null,nxt=ALL[ci+1]||null,h="";
  if(n>TRIP_END){
    h='<span class="pill next"><span class="dot"></span>연수 종료</span><p class="nowtitle">수고 많으셨어요</p><p class="small">조별 결과보고서(한글 파일)는 연수 종료 후 1주 이내, 개인 결과보고는 30일 이내예요. 메모 탭의 "보고서용 정리"를 활용하세요.</p>';
  }else{
    h+=cur?'<span class="pill live"><span class="dot"></span>지금 · '+esc(evLine(cur))+'</span><p class="nowtitle">'+esc(cur.what)+'</p>':'<span class="pill next"><span class="dot"></span>곧 시작</span><p class="nowtitle">연수 출발 전이에요</p>';
    if(nxt)h+='<dl class="kv"><dt>다음</dt><dd><b>'+esc(nxt.what)+'</b></dd><dt>시각</dt><dd class="mono">'+esc(evLine(nxt))+' · '+esc(dur(nxt.at-n))+' 뒤</dd><dt>장소</dt><dd>'+esc(PLACES[nxt.place].name)+'</dd></dl>';
    var focus=(cur&&cur.inst)?cur:(nxt&&nxt.inst?nxt:null),target=nxt||cur;
    h+='<div class="btnrow">';
    if(target)h+='<a class="btn primary" href="'+dirUrl(target.place)+'" target="_blank" rel="noopener">길찾기</a>';
    if(focus)focus.inst.forEach(function(k){h+='<button class="btn" type="button" data-inst="'+k+'">'+esc(INST[k].name)+' 정보</button>';});
    h+='<button class="btn" type="button" data-newmemo="1">+ 메모</button></div>';
    if(focus&&focus.tags)h+='<div>'+focus.tags.map(tagHtml).join("")+'</div>';
    if(cur&&cur.tip)h+='<p class="info">'+esc(cur.tip)+'</p>';
  }
  $("nowcard").innerHTML=h;
  $("todayhead").textContent=d.date.slice(5).replace("-","/")+" ("+d.w+") 일정";
  $("todaytl").innerHTML=timeline(di,n);
  renderLoc(n,di);
}
function timeline(di,n){
  var ci=currentIdx(n);
  return DAYS[di].ev.map(function(e){
    var gi=ALL.indexOf(e),cls="ev"+(e.inst?" inst":"")+(gi===ci?" cur":(gi<ci?" past":""));
    var inner='<span class="what">'+esc(e.what)+'</span><span class="where">'+esc(PLACES[e.place].name)+(e.tz==="K"?" · 한국 시각":"")+'</span>'+(e.tags?'<span>'+e.tags.map(tagHtml).join("")+'</span>':'');
    return '<li class="'+cls+'"><span class="t">'+e.t+'</span><span class="rail"><span class="node"></span></span><div class="body">'+(e.inst?'<button class="open" type="button" data-inst="'+e.inst[0]+'">'+inner+'</button>':inner)+'</div></li>';
  }).join("");
}

/* ================= location ================= */
var GEO=null,GEOMSG="";
function renderLoc(n,di){
  var d=DAYS[di],ci=currentIdx(n),cur=ci>=0?ALL[ci]:ALL[0],hk=d.hotel;
  var h='<div class="sechead"><h3>위치</h3><button class="btn" type="button" id="geobtn">'+(GEO?'위치 새로고침':'내 위치 확인')+'</button></div>';
  h+='<p class="small">일정상 지금은 <b>'+esc(PLACES[cur.place].name)+'</b> 근처예요.</p>';
  if(GEO){
    var best=null;MAP_PLACES.forEach(function(k){var p=PLACES[k],km=hav(GEO.lat,GEO.lng,p.lat,p.lng);if(!best||km<best.km)best={k:k,km:km};});
    var tgt=ALL[ci+1]||cur,tk=hav(GEO.lat,GEO.lng,PLACES[tgt.place].lat,PLACES[tgt.place].lng);
    h+='<p class="small">GPS 기준 가장 가까운 연수 장소는 <b>'+esc(PLACES[best.k].name)+'</b> (약 '+best.km.toFixed(1)+'km), 다음 일정 장소까지 약 '+tk.toFixed(1)+'km예요. <span class="muted">('+fmt(GEO.at,"Europe/London")+' 기준)</span></p>';
  }else if(GEOMSG)h+='<p class="small muted">'+esc(GEOMSG)+'</p>';
  if(hk){var p=PLACES[hk];h+='<div class="divider"></div><p class="small muted">오늘 밤 숙소</p><p><b>'+esc(p.name)+'</b></p><p class="small">'+esc(p.addr)+'</p><p class="small mono">'+esc(p.phone)+'</p><div class="btnrow"><a class="btn" href="'+mapUrl(hk)+'" target="_blank" rel="noopener">지도</a><a class="btn" href="'+dirUrl(hk)+'" target="_blank" rel="noopener">호텔로 길찾기</a></div>';}
  $("loccard").innerHTML=h;
}
function getPos(timeout){
  return new Promise(function(res){
    if(!navigator.geolocation)return res(null);
    try{navigator.geolocation.getCurrentPosition(function(p){res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,at:Date.now()});},function(){res(null);},{enableHighAccuracy:true,timeout:timeout||10000,maximumAge:60000});}catch(e){res(null);}
  });
}
async function askGeo(){
  GEOMSG="위치를 확인하는 중이에요…";renderNow();
  var p=await getPos();
  if(p){GEO=p;GEOMSG="";}else GEOMSG="위치를 가져오지 못했어요. 브라우저 설정에서 이 사이트의 위치 권한을 허용해 주세요.";
  renderNow();updateMyLocMarker();
}

/* ================= memo store (IndexedDB) ================= */
var MEMOS=[],DBP=null;
function db(){if(DBP)return DBP;DBP=new Promise(function(res,rej){var r=indexedDB.open("uktrip",1);r.onupgradeneeded=function(){r.result.createObjectStore("memos",{keyPath:"id"});};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return DBP;}
function tx(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction("memos",mode),s=t.objectStore("memos"),out=fn(s);t.oncomplete=function(){res(out&&out.result!==undefined?out.result:out);};t.onerror=function(){rej(t.error);};});});}
function loadAll(){return tx("readonly",function(s){return s.getAll();}).then(function(r){MEMOS=r||[];});}
function putMemo(m){return tx("readwrite",function(s){s.put(m);});}
function delMemo(id){return tx("readwrite",function(s){s.delete(id);});}
function memoSortAt(m){var ts=(m.photos||[]).map(function(p){return p.time;}).filter(Boolean);return ts.length?Math.min.apply(null,ts):m.createdAt;}
function sortedMemos(){return MEMOS.slice().sort(function(a,b){return memoSortAt(a)-memoSortAt(b);});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

var URLS={};
function photoUrl(p){if(!URLS[p.id])URLS[p.id]=URL.createObjectURL(p.blob);return URLS[p.id];}
function findPhoto(pid){for(var i=0;i<MEMOS.length;i++){var ps=MEMOS[i].photos||[];for(var j=0;j<ps.length;j++)if(ps[j].id===pid)return ps[j];}return null;}
function hydrateThumbs(root){root.querySelectorAll("img[data-pid]").forEach(function(img){var p=findPhoto(img.dataset.pid)||(EDIT&&EDIT.photos.filter(function(x){return x.id===img.dataset.pid;})[0]);if(p)img.src=photoUrl(p);});}

function memoCard(m){
  var t=memoSortAt(m),src=(m.photos||[]).some(function(p){return p.time;})?"사진 시각":"작성 시각";
  var head='<span class="mono">'+esc(fmtDT(t))+'</span><span>'+src+'</span>'+(m.inst?'<span class="tag">'+esc(INST[m.inst].name)+'</span>':'')+(m.lat!=null?'<span>📍</span>':'');
  var th=(m.photos||[]).length?'<div class="thumbs">'+m.photos.map(function(p){return '<img alt="" data-pid="'+p.id+'">';}).join("")+'</div>':'';
  return '<button class="mitem" type="button" data-memo="'+m.id+'"><div class="mhead">'+head+'</div>'+(m.text?'<p class="mtext">'+esc(m.text)+'</p>':'')+th+'</button>';
}
function renderMemoList(){
  var ms=sortedMemos(),h="",last="";
  $("memocount").textContent=ms.length?ms.length+"개":"";
  if(!ms.length)h='<p class="empty">아직 메모가 없어요. 오른쪽 아래 "+ 메모"를 눌러 첫 메모를 남겨 보세요. 사진을 넣으면 사진 찍은 시각과 위치가 자동으로 들어가요.</p>';
  ms.forEach(function(m){var day=ymdIn(memoSortAt(m),"Europe/London");if(day!==last){var di=DAYS.findIndex(function(d){return d.date===day;});h+='<p class="mday">'+day.slice(5).replace("-","/")+(di>=0?' · '+DAYS[di].n+'일차 '+esc(DAYS[di].city):'')+'</p>';last=day;}h+=memoCard(m);});
  $("mlist").innerHTML=h;hydrateThumbs($("mlist"));
  renderMapMarkers();
}

/* ================= map ================= */
var MAP=null,MEMO_LAYER=null,ME_MARKER=null;
function initMap(){
  if(MAP||!window.L)return;
  MAP=L.map("map",{zoomControl:true,attributionControl:true}).setView([52.9,-1.4],6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(MAP);
  MAP_PLACES.forEach(function(k){var p=PLACES[k];L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:'<div class="vpin"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(MAP).bindPopup('<b>'+esc(p.name)+'</b><br><a href="'+dirUrl(k)+'" target="_blank" rel="noopener">길찾기</a>');});
  MEMO_LAYER=L.layerGroup().addTo(MAP);
  renderMapMarkers(true);updateMyLocMarker();
}
function renderMapMarkers(fit){
  if(!MAP)return;MEMO_LAYER.clearLayers();var pts=[];
  sortedMemos().forEach(function(m,i){
    if(m.lat==null)return;var ph=(m.photos||[])[0];
    var html=ph?'<div class="mpin" style="background-image:url('+photoUrl(ph)+')"></div>':'<div class="mpin">'+(i+1)+'</div>';
    var mk=L.marker([m.lat,m.lng],{icon:L.divIcon({className:"",html:html,iconSize:[30,30],iconAnchor:[15,15]})});
    var pop=(ph?'<img src="'+photoUrl(ph)+'" alt="">':'')+'<b class="mono">'+esc(fmtDT(memoSortAt(m)))+'</b><br>'+esc((m.text||"").slice(0,80))+((m.text||"").length>80?'…':'')+'<br><a href="#" data-memo="'+m.id+'">열기</a>';
    mk.bindPopup(pop);MEMO_LAYER.addLayer(mk);pts.push([m.lat,m.lng]);
  });
  if(fit){if(pts.length)MAP.fitBounds(pts,{padding:[30,30],maxZoom:15});else{var d=DAYS[dayIndexFor(Date.now())],ks=[];d.ev.forEach(function(e){if(ks.indexOf(e.place)<0&&MAP_PLACES.indexOf(e.place)>=0)ks.push(e.place);});if(ks.length)MAP.fitBounds(ks.map(function(k){return [PLACES[k].lat,PLACES[k].lng];}),{padding:[40,40],maxZoom:13});}}
}
function updateMyLocMarker(){
  if(!MAP||!GEO)return;
  if(ME_MARKER)ME_MARKER.setLatLng([GEO.lat,GEO.lng]);
  else ME_MARKER=L.circleMarker([GEO.lat,GEO.lng],{radius:7,color:"#fff",weight:2,fillColor:"#2a7de1",fillOpacity:1}).addTo(MAP).bindPopup("내 위치");
}

/* ================= photo processing ================= */
async function readExif(file){
  var out={time:null,lat:null,lng:null};
  if(!window.exifr)return out;
  try{var m=await exifr.parse(file,{pick:["DateTimeOriginal","CreateDate","OffsetTimeOriginal"]});var dt=m&&(m.DateTimeOriginal||m.CreateDate);if(dt instanceof Date&&!isNaN(dt))out.time=dt.getTime();}catch(e){}
  try{var g=await exifr.gps(file);if(g&&isFinite(g.latitude)&&isFinite(g.longitude)){out.lat=g.latitude;out.lng=g.longitude;}}catch(e){}
  return out;
}
function shrink(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1600,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){res(b||file);},"image/jpeg",0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}

/* ================= memo editor ================= */
var EDIT=null,DELARM=false;
function currentInstGuess(){var n=Date.now(),ci=currentIdx(n),e=ALL[ci],nx=ALL[ci+1];if(e&&e.inst&&(!nx||n<nx.at))return e.inst[0];return "";}
async function openEditor(id,presetInst){
  var m=id?MEMOS.filter(function(x){return x.id===id;})[0]:null;
  EDIT=m?JSON.parse(JSON.stringify(Object.assign({},m,{photos:[]}))):{id:uid(),text:"",inst:presetInst||currentInstGuess(),createdAt:Date.now(),lat:null,lng:null,locSrc:null,photos:[]};
  if(m)EDIT.photos=(m.photos||[]).slice();
  EDIT.isNew=!m;DELARM=false;
  renderEditor();
  if(EDIT.isNew){var st=$("locline");if(st)st.textContent="현재 위치를 가져오는 중…";var p=await getPos(8000);if(EDIT&&EDIT.isNew&&EDIT.lat==null&&p){EDIT.lat=p.lat;EDIT.lng=p.lng;EDIT.locSrc="device";GEO=p;updateMyLocMarker();}if(EDIT)updateLocLine();}
}
function renderEditor(){
  var opts='<option value="">기관 연결 안 함</option>'+INST_ORDER.map(function(k){return '<option value="'+k+'"'+(EDIT.inst===k?' selected':'')+'>'+esc(INST[k].name)+'</option>';}).join("");
  var h='<div class="sec"><h1 class="big">'+(EDIT.isNew?'새 메모':'메모 수정')+'</h1><p class="small muted mono" id="timeline-info"></p></div>';
  h+='<div class="field"><label for="m-text">내용</label><textarea id="m-text" placeholder="들은 답, 인상 깊었던 점, 보고서에 쓸 내용">'+esc(EDIT.text)+'</textarea></div>';
  h+='<div class="field"><label>사진</label><div class="pgrid" id="pgrid"></div><input type="file" id="m-photo" accept="image/*" multiple hidden></div>';
  h+='<div class="field"><label for="m-inst">기관</label><select id="m-inst">'+opts+'</select></div>';
  h+='<div class="field"><label>위치</label><p class="small" id="locline"></p><div class="btnrow"><button class="btn" type="button" id="m-locnow">지금 위치로</button><button class="btn" type="button" id="m-locclear">위치 지우기</button></div></div>';
  h+='<div class="btnrow" style="margin-top:6px"><button class="btn primary" type="button" id="m-save">저장</button>'+(EDIT.isNew?'':'<button class="btn danger" type="button" id="m-del">삭제</button>')+'<span class="savestate" id="m-state"></span></div>';
  openSheet(h,'',function(){EDIT=null;});
  renderPhotoGrid();updateLocLine();updateTimeInfo();
  $("m-text").addEventListener("input",function(){EDIT.text=this.value;});
  $("m-inst").addEventListener("change",function(){EDIT.inst=this.value;});
  $("m-photo").addEventListener("change",onPhotos);
}
function renderPhotoGrid(){
  var g=$("pgrid");if(!g)return;
  g.innerHTML=EDIT.photos.map(function(p){return '<div class="pcell"><img alt="" src="'+photoUrl(p)+'"><button class="x" type="button" data-rmphoto="'+p.id+'" aria-label="사진 빼기">×</button>'+(p.time?'<span class="pt">'+esc(fmtDT(p.time))+(p.lat!=null?' 📍':'')+'</span>':'')+'</div>';}).join("")+'<label class="addphoto" for="m-photo">+ 사진<br>추가</label>';
}
function updateLocLine(){
  var l=$("locline");if(!l||!EDIT)return;
  if(EDIT.lat==null)l.textContent="위치 없음 (지도에 표시되지 않아요)";
  else l.innerHTML=(EDIT.locSrc==="photo"?"사진 위치":"작성할 때 위치")+' · <span class="mono">'+EDIT.lat.toFixed(5)+', '+EDIT.lng.toFixed(5)+'</span> <a href="'+mapUrlAddr(EDIT.lat+","+EDIT.lng)+'" target="_blank" rel="noopener">지도</a>';
}
function updateTimeInfo(){var el=$("timeline-info");if(!el||!EDIT)return;var t=memoSortAt(EDIT);el.textContent=fmtDT(t)+" · "+((EDIT.photos||[]).some(function(p){return p.time;})?"사진 찍은 시각 기준으로 정렬돼요":"작성 시각 기준으로 정렬돼요");}
async function onPhotos(e){
  var files=[].slice.call(e.target.files||[]);e.target.value="";if(!files.length)return;
  var st=$("m-state");st.textContent="사진 처리 중… (0/"+files.length+")";
  var gpsFound=0;
  for(var i=0;i<files.length;i++){
    var f=files[i],ex=await readExif(f),blob=await shrink(f);
    var p={id:uid(),blob:blob,time:ex.time||null,lat:ex.lat,lng:ex.lng};
    EDIT.photos.push(p);if(p.lat!=null)gpsFound++;
    st.textContent="사진 처리 중… ("+(i+1)+"/"+files.length+")";
  }
  var withGps=EDIT.photos.filter(function(p){return p.lat!=null;});
  if(withGps.length&&EDIT.locSrc!=="photo"){EDIT.lat=withGps[0].lat;EDIT.lng=withGps[0].lng;EDIT.locSrc="photo";}
  st.textContent=files.length+"장 추가"+(gpsFound?" · 사진 위치 사용":(EDIT.lat!=null?" · 사진에 위치 정보가 없어 작성 위치 사용":" · 사진에 위치 정보 없음"));
  renderPhotoGrid();updateLocLine();updateTimeInfo();
}
async function saveEdit(){
  if(!EDIT)return;
  EDIT.text=$("m-text").value;EDIT.inst=$("m-inst").value;
  if(!EDIT.text.trim()&&!EDIT.photos.length){$("m-state").textContent="내용이나 사진을 넣어 주세요.";return;}
  var m={id:EDIT.id,text:EDIT.text,inst:EDIT.inst,createdAt:EDIT.createdAt,updatedAt:Date.now(),lat:EDIT.lat,lng:EDIT.lng,locSrc:EDIT.locSrc,photos:EDIT.photos};
  try{await putMemo(m);}catch(err){$("m-state").textContent="저장하지 못했어요. 저장 공간을 확인해 주세요.";return;}
  await loadAll();closeSheet();refreshMemoViews();toast("메모를 저장했어요");
}
async function deleteEdit(){
  if(!DELARM){DELARM=true;$("m-del").textContent="한 번 더 누르면 삭제";return;}
  await delMemo(EDIT.id);await loadAll();closeSheet();refreshMemoViews();toast("메모를 삭제했어요");
}
function refreshMemoViews(){renderMemoList();renderInstList();}

/* ================= report / backup ================= */
function buildReport(){
  var ms=sortedMemos(),out=["# 영국 국외연수 현장 메모","(정리: "+fmtDT(Date.now())+" 영국 시각)",""];
  INST_ORDER.forEach(function(k){var xs=ms.filter(function(m){return m.inst===k;});if(!xs.length)return;out.push("## "+INST[k].name+" ("+INST[k].when+")");xs.forEach(function(m){out.push("- ["+fmtDT(memoSortAt(m))+"] "+(m.text||"").trim().replace(/\n+/g," / ")+((m.photos||[]).length?" (사진 "+m.photos.length+"장)":""));});out.push("");});
  var rest=ms.filter(function(m){return !m.inst;});
  if(rest.length){out.push("## 기타 (직무 탐색, 조별 활동 등)");var last="";rest.forEach(function(m){var d=ymdIn(memoSortAt(m),"Europe/London");if(d!==last){out.push("### "+d.slice(5).replace("-","/"));last=d;}out.push("- ["+fmt(memoSortAt(m),"Europe/London")+"] "+(m.text||"").trim().replace(/\n+/g," / ")+((m.photos||[]).length?" (사진 "+m.photos.length+"장)":""));});}
  return out.join("\n");
}
function openReport(){
  var txt=buildReport();
  openSheet('<div class="sec"><h1 class="big">보고서용 정리</h1><p class="small muted">기관별, 날짜별로 메모를 시간순으로 모았어요. 복사해서 보고서 초안에 붙여 넣으세요.</p></div><textarea id="reporttext" style="min-height:55vh" readonly>'+esc(txt)+'</textarea><div class="btnrow"><button class="btn primary" type="button" data-copy="'+esc(txt)+'">전체 복사</button></div>','',null);
}
function blobToDataURL(b){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.readAsDataURL(b);});}
async function exportBackup(){
  toast("백업 파일을 만드는 중이에요…");
  var ms=[];for(var i=0;i<MEMOS.length;i++){var m=MEMOS[i],ps=[];for(var j=0;j<(m.photos||[]).length;j++){var p=m.photos[j];ps.push({id:p.id,time:p.time,lat:p.lat,lng:p.lng,data:await blobToDataURL(p.blob)});}ms.push(Object.assign({},m,{photos:ps}));}
  var json=JSON.stringify({app:"uk-trip",version:1,exportedAt:new Date().toISOString(),memos:ms});
  var name="uk-trip-memos-"+ymdIn(Date.now(),"Europe/London")+"-"+fmt(Date.now(),"Europe/London").replace(":","")+".json";
  var file=new File([json],name,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"영국 연수 메모 백업"});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  var a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
  toast("백업 파일을 저장했어요");
}
async function importBackup(file){
  try{
    var data=JSON.parse(await file.text());if(!data||!Array.isArray(data.memos))throw 0;
    var n=0;for(var i=0;i<data.memos.length;i++){var m=data.memos[i],ps=[];for(var j=0;j<(m.photos||[]).length;j++){var p=m.photos[j];var b=await (await fetch(p.data)).blob();ps.push({id:p.id,time:p.time,lat:p.lat,lng:p.lng,blob:b});}m.photos=ps;await putMemo(m);n++;}
    await loadAll();refreshMemoViews();renderMapMarkers(true);toast("메모 "+n+"개를 불러왔어요");
  }catch(e){toast("백업 파일을 읽지 못했어요. 이 앱에서 내보낸 .json 파일인지 확인해 주세요.");}
}

/* ================= info ================= */
function renderInfo(){
  var h='<h2>긴급 연락처</h2><div class="card"><table class="mini">'+
   '<tr><td>영국 긴급</td><td class="mono">999</td></tr><tr><td>비응급 의료(NHS)</td><td class="mono">111</td></tr>'+
   '<tr><td>대사관 (근무시간)</td><td class="mono">+44 20 7227 5500</td></tr><tr><td>대사관 (근무시간 외)</td><td class="mono">+44 78 7650 6895</td></tr>'+
   '<tr><td>영사콜센터 (24시간)</td><td class="mono">+82 2 3210 0404</td></tr><tr><td>인솔자·가이드</td><td>단톡방 공지 연락처</td></tr>'+
   '</table><div class="btnrow"><a class="btn" href="'+mapUrl("embassy")+'" target="_blank" rel="noopener">대사관 지도</a></div></div>';
  h+='<h2>도시별 응급실 (24시간 A&amp;E)</h2>';
  Object.keys(HOSP).forEach(function(c){var x=HOSP[c];h+='<div class="card"><p class="small muted">'+c+' · '+esc(x.note)+'</p><p><b>'+esc(x.name)+'</b></p><p class="small">'+esc(x.addr)+'</p><p class="small mono">'+esc(x.phone)+'</p><div class="btnrow"><a class="btn" href="'+mapUrlAddr(x.addr)+'" target="_blank" rel="noopener">지도</a></div></div>';});
  h+='<h2>과제와 마감</h2><div class="card"><table class="mini">'+
   '<tr><td>10/19 (월) 16:00</td><td>총평 간담회 · 조별 워크숍 발표 (PPT)</td></tr>'+
   '<tr><td>귀국 후 1주 이내 (~10/28)</td><td>조별 결과보고서, 한글 파일로 제출</td></tr>'+
   '<tr><td>귀국 후 30일 이내</td><td>개인 결과보고 (학교·시도교육청)</td></tr></table>'+
   '<p class="note">AI로 쓴 글은 그대로 붙이지 말고 직접 검수하세요. ** 같은 기호를 지우고 기관 방문 사진을 첨부해요.</p></div>';
  h+='<h2>현지에서 지킬 것</h2><div class="card"><ul class="dots">'+
   '<li>매일 아침 버스에서 휴대폰·지갑·여권을 손으로 확인하세요. 소매치기가 많아요.</li>'+
   '<li>전체 단톡방에는 기관 방문 사진만 올려요. 개인·풍경 사진은 조별 방에 올리세요.</li>'+
   '<li>개별 행동은 자제하고 조 단위로 움직여요.</li>'+
   '<li>셀카 찍을 때 자전거와 차량을 조심하세요.</li>'+
   '<li>기관 방문 때는 셔츠에 벨트 맨 바지 정도의 세미 정장을 입어요.</li>'+
   '<li>영국은 230V G타입(3핀) 콘센트를 써요.</li></ul></div>';
  h+='<h2>시차와 날씨</h2><div class="card"><p class="small">영국은 지금 서머타임이라 한국보다 8시간 느려요. 10/25부터는 9시간 차이가 나요. 연수 기간 기온은 최고 12~15℃, 최저 9~12℃이고 비 오는 날이 있어요.</p></div>';
  h+='<h2>메모 보관</h2><div class="card"><p class="small">메모와 사진은 이 휴대폰 브라우저에만 저장돼요. 브라우저 데이터를 지우거나 다른 기기로 바꾸면 사라지니, 하루 일정이 끝나면 메모 탭의 "백업 내보내기"로 파일을 받아 두세요. 아이폰은 홈 화면에 추가해서 쓰면 데이터가 더 안정적으로 유지돼요.</p></div>';
  $("infobody").innerHTML=h;
}

/* ================= tabs + events ================= */
var TABS=["now","plan","inst","memo","info"];
function setTab(t){
  TABS.forEach(function(x){$("view-"+x).hidden=(x!==t);});
  document.querySelectorAll(".tabbar button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===t));});
  $("fab").hidden=(t!=="memo");
  if(t==="plan")renderPlan();
  if(t==="now")renderNow();
  if(t==="memo"){initMap();setTimeout(function(){if(MAP){MAP.invalidateSize();renderMapMarkers(true);}},60);}
  try{localStorage.setItem("tab",t);}catch(e){}
  window.scrollTo(0,0);
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-inst],[data-tab],[data-day],[data-copy],[data-memo],[data-newmemo],[data-rmphoto],#geobtn,#gotoall,#sheetback,#fab,#m-save,#m-del,#m-locnow,#m-locclear,#btn-report,#btn-backup");
  if(!el)return;
  if(el.id==="sheetback")return closeSheet();
  if(el.id==="geobtn")return askGeo();
  if(el.id==="gotoall"){planDay=null;return setTab("plan");}
  if(el.id==="fab")return openEditor(null);
  if(el.id==="m-save")return saveEdit();
  if(el.id==="m-del")return deleteEdit();
  if(el.id==="btn-report")return openReport();
  if(el.id==="btn-backup")return exportBackup();
  if(el.id==="m-locnow"){$("locline").textContent="현재 위치를 가져오는 중…";return getPos(8000).then(function(p){if(!EDIT)return;if(p){EDIT.lat=p.lat;EDIT.lng=p.lng;EDIT.locSrc="device";}updateLocLine();if(!p)$("locline").textContent="위치를 가져오지 못했어요. 위치 권한을 확인해 주세요.";});}
  if(el.id==="m-locclear"){EDIT.lat=EDIT.lng=null;EDIT.locSrc=null;return updateLocLine();}
  if(el.dataset.rmphoto){EDIT.photos=EDIT.photos.filter(function(p){return p.id!==el.dataset.rmphoto;});var g=EDIT.photos.filter(function(p){return p.lat!=null;});if(EDIT.locSrc==="photo"){if(g.length){EDIT.lat=g[0].lat;EDIT.lng=g[0].lng;}else{EDIT.lat=EDIT.lng=null;EDIT.locSrc=null;}}renderPhotoGrid();updateLocLine();return updateTimeInfo();}
  if(el.dataset.tab)return setTab(el.dataset.tab);
  if(el.dataset.day){planDay=+el.dataset.day;return renderPlan();}
  if(el.dataset.newmemo){var k=el.dataset.newmemo==="1"?"":el.dataset.newmemo;return openEditor(null,k);}
  if(el.dataset.memo){ev.preventDefault();if(MAP)MAP.closePopup();return openEditor(el.dataset.memo);}
  if(el.dataset.inst)return openInst(el.dataset.inst);
  if(el.dataset.copy){var txt=el.dataset.copy;try{navigator.clipboard.writeText(txt).then(function(){toast("복사했어요");},function(){toast("복사하지 못했어요. 길게 눌러 선택해 주세요");});}catch(e){toast("복사하지 못했어요");}}
});
$("importfile").addEventListener("change",function(e){var f=e.target.files&&e.target.files[0];e.target.value="";if(f)importBackup(f);});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("sheet").hidden)closeSheet();});

function tick(){renderClock();if(!$("view-now").hidden)renderNow();}
renderClock();renderNow();renderInfo();renderInstList();
loadAll().then(refreshMemoViews).catch(function(){$("mlist").innerHTML='<p class="empty">이 브라우저에서는 메모 저장을 쓸 수 없어요. 사파리나 크롬 일반 창에서 열어 주세요.</p>';});
try{var saved=localStorage.getItem("tab");if(saved&&TABS.indexOf(saved)>=0&&saved!=="now")setTab(saved);}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if(navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:"geolocation"}).then(function(s){if(s.state==="granted")askGeo();});}catch(e){}
setInterval(tick,30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick();});
</script>
